version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: nest-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nestdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  postgrest:
    image: postgrest/postgrest:latest
    container_name: nest-test-postgrest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/nestdb
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: 3000
      PGRST_JWT_SECRET: "verylongsecretkeythatisatleast32chars!"
      PGRST_DB_CONFIG: "standard_conforming_strings=on"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nest-test-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: user@domain.com
      PGADMIN_DEFAULT_PASSWORD: postgres
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data: {}
